<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 로그인 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            display: none;
        }

        .auth-container.active {
            display: block;
        }

        .game-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            display: none;
        }

        .game-container.active {
            display: block;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .toggle-text a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            color: #27ae60;
            background: #d5f4e6;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .user-info p {
            color: #333;
            margin: 5px 0;
        }

        .user-name {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        .logout-btn {
            background: #e74c3c;
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .game-title {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }

        .game-content {
            text-align: center;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .choice-btn {
            width: 100px;
            height: 100px;
            font-size: 40px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: #667eea;
            color: white;
        }

        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-text {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        .score-text {
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        .choices-display {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로그인 화면 -->
        <div class="auth-container active" id="loginContainer">
            <h1>🎮 게임 로그인</h1>

            <div class="error" id="loginError"></div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">아이디</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">비밀번호</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">로그인</button>
            </form>

            <div class="toggle-text">
                아직 회원이 아니신가요? <a onclick="switchToSignup()">회원가입</a>
            </div>
        </div>

        <!-- 회원가입 화면 -->
        <div class="auth-container" id="signupContainer">
            <h1>🎮 게임 회원가입</h1>

            <div class="error" id="signupError"></div>
            <div class="success" id="signupSuccess"></div>

            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupUsername">아이디</label>
                    <input type="text" id="signupUsername" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">비밀번호</label>
                    <input type="password" id="signupPassword" required>
                </div>
                <div class="form-group">
                    <label for="signupPasswordConfirm">비밀번호 확인</label>
                    <input type="password" id="signupPasswordConfirm" required>
                </div>
                <button type="submit">회원가입</button>
            </form>

            <div class="toggle-text">
                이미 회원이신가요? <a onclick="switchToLogin()">로그인</a>
            </div>
        </div>

        <!-- 게임 화면 -->
        <div class="game-container" id="gameContainer">
            <div class="user-info">
                <p>환영합니다!</p>
                <p class="user-name" id="userDisplay"></p>
                <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
            </div>

            <h2 class="game-title">✌️ 가위바위보 게임</h2>

            <div class="game-content">
                <div class="result" id="resultDisplay">
                    <div class="result-text">시작하려면 아래에서 선택하세요</div>
                    <div class="score-text" id="scoreDisplay">승리: 0 | 패배: 0 | 무승부: 0</div>
                </div>

                <div class="choices-display" id="choicesDisplay"></div>

                <div class="choices">
                    <button class="choice-btn" onclick="playGame('바위')">✊</button>
                    <button class="choice-btn" onclick="playGame('보')">✋</button>
                    <button class="choice-btn" onclick="playGame('보')">✌️</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 사용자 데이터 관리
        function getUsersData() {
            const data = localStorage.getItem('users');
            return data ? JSON.parse(data) : {};
        }

        function saveUsersData(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function getCurrentUser() {
            return localStorage.getItem('currentUser');
        }

        function setCurrentUser(username) {
            localStorage.setItem('currentUser', username);
        }

        function clearCurrentUser() {
            localStorage.removeItem('currentUser');
        }

        // 게임 점수 관리
        function getGameScore(username) {
            const scores = JSON.parse(localStorage.getItem('gameScores') || '{}');
            return scores[username] || { wins: 0, losses: 0, draws: 0 };
        }

        function saveGameScore(username, score) {
            const scores = JSON.parse(localStorage.getItem('gameScores') || '{}');
            scores[username] = score;
            localStorage.setItem('gameScores', JSON.stringify(scores));
        }

        // 에러 메시지 표시
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.classList.add('show');
            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 3000);
        }

        // 성공 메시지 표시
        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.classList.add('show');
            setTimeout(() => {
                successElement.classList.remove('show');
            }, 3000);
        }

        // 로그인 처리
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            const users = getUsersData();

            if (!users[username]) {
                showError('loginError', '존재하지 않는 아이디입니다.');
                return;
            }

            if (users[username] !== password) {
                showError('loginError', '비밀번호가 올바르지 않습니다.');
                return;
            }

            setCurrentUser(username);
            switchToGame();
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        // 회원가입 처리
        function handleSignup(event) {
            event.preventDefault();

            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

            if (username.length < 3) {
                showError('signupError', '아이디는 3글자 이상이어야 합니다.');
                return;
            }

            if (password.length < 4) {
                showError('signupError', '비밀번호는 4글자 이상이어야 합니다.');
                return;
            }

            if (password !== passwordConfirm) {
                showError('signupError', '비밀번호가 일치하지 않습니다.');
                return;
            }

            const users = getUsersData();

            if (users[username]) {
                showError('signupError', '이미 존재하는 아이디입니다.');
                return;
            }

            users[username] = password;
            saveUsersData(users);

            showSuccess('signupSuccess', '회원가입이 완료되었습니다! 로그인해주세요.');

            setTimeout(() => {
                document.getElementById('signupUsername').value = '';
                document.getElementById('signupPassword').value = '';
                document.getElementById('signupPasswordConfirm').value = '';
                switchToLogin();
            }, 2000);
        }

        // 로그아웃 처리
        function handleLogout() {
            clearCurrentUser();
            switchToLogin();
            document.getElementById('resultDisplay').innerHTML = '<div class="result-text">시작하려면 아래에서 선택하세요</div><div class="score-text" id="scoreDisplay">승리: 0 | 패배: 0 | 무승부: 0</div>';
        }

        // 화면 전환
        function switchToLogin() {
            document.getElementById('loginContainer').classList.add('active');
            document.getElementById('signupContainer').classList.remove('active');
            document.getElementById('gameContainer').classList.remove('active');
        }

        function switchToSignup() {
            document.getElementById('loginContainer').classList.remove('active');
            document.getElementById('signupContainer').classList.add('active');
            document.getElementById('gameContainer').classList.remove('active');
        }

        function switchToGame() {
            document.getElementById('loginContainer').classList.remove('active');
            document.getElementById('signupContainer').classList.remove('active');
            document.getElementById('gameContainer').classList.add('active');

            const currentUser = getCurrentUser();
            document.getElementById('userDisplay').textContent = currentUser;
            updateScoreDisplay();
        }

        // 게임 로직
        function playGame(userChoice) {
            const choices = ['바위', '보', '보'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            let result = '';
            let userWin = false;

            if (userChoice === computerChoice) {
                result = '무승부!';
            } else if (
                (userChoice === '바위' && computerChoice === '보') ||
                (userChoice === '보' && computerChoice === '보') ||
                (userChoice === '보' && computerChoice === '바위')
            ) {
                result = '패배!';
            } else {
                result = '승리!';
                userWin = true;
            }

            const currentUser = getCurrentUser();
            const score = getGameScore(currentUser);

            if (result === '승리!') {
                score.wins++;
            } else if (result === '패배!') {
                score.losses++;
            } else {
                score.draws++;
            }

            saveGameScore(currentUser, score);

            displayResult(userChoice, computerChoice, result);
            updateScoreDisplay();
        }

        function displayResult(userChoice, computerChoice, result) {
            const choiceEmojis = {
                '바위': '✊',
                '보': '✋'
            };

            const resultDisplay = document.getElementById('resultDisplay');
            const score = getGameScore(getCurrentUser());

            resultDisplay.innerHTML = `
                <div class="choices-display">
                    <div>당신: ${choiceEmojis[userChoice]}</div>
                    <div>컴퓨터: ${choiceEmojis[computerChoice]}</div>
                </div>
                <div class="result-text" style="color: ${result === '승리!' ? '#27ae60' : result === '패배!' ? '#e74c3c' : '#f39c12'}; font-size: 24px; font-weight: bold;">
                    ${result}
                </div>
                <div class="score-text">승리: ${score.wins} | 패배: ${score.losses} | 무승부: ${score.draws}</div>
            `;
        }

        function updateScoreDisplay() {
            const currentUser = getCurrentUser();
            const score = getGameScore(currentUser);
            document.getElementById('scoreDisplay').textContent = `승리: ${score.wins} | 패배: ${score.losses} | 무승부: ${score.draws}`;
        }

        // 페이지 로드시 확인
        window.addEventListener('load', function() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                switchToGame();
            } else {
                switchToLogin();
            }
        });
    </script>
</body>
</html>
